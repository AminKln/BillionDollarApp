AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Anomaly Detection -> LLM Root-Cause Agent (CloudWatch-native).
  Subscribes a Lambda to an existing CloudWatch alarm's SNS topic
  (AlarmTopicArn) — this stack does not create its own alarm/anomaly
  detector/topic, since one already exists in this account. On alarm, the
  Lambda gathers real alarm/metric/log evidence plus codebase context
  (fetched live from GitHub) into one prompt and sends it to Claude. See
  docs/architecture.md for background — note the notify/dashboard-widget
  step it describes has since been removed for simplicity; the verdict is
  logged and returned as the Lambda's invocation result.

Parameters:
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Description: >
      Anthropic API key for the direct Claude API call (agent/llm_agent.py).
      Pass via `sam deploy --parameter-overrides AnthropicApiKey=$ANTHROPIC_API_KEY`
      (sourced from .env) — never commit a real value into samconfig.toml.
  LogGroupName:
    Type: String
    Default: ""
    Description: >
      CloudWatch log group the demo app writes to — queried for log evidence
      around the alarm window (agent/context_builder.py). Empty = skip log
      evidence entirely (app doesn't ship logs yet); the hypothesis is based
      on alarm + metric evidence only until this is set.
  GithubOwner:
    Type: String
    Default: ""
    Description: >
      GitHub org/user of the target APP's repo (not this repo) --
      get_codebase_context_from_github() (agent/github_context.py) fetches
      its entire current source tree live on every alarm.
  GithubRepo:
    Type: String
    Default: ""
    Description: Repo name of the target app whose codebase context gets fetched live.
  GithubRef:
    Type: String
    Default: ""
    Description: Branch/commit/tag to fetch the codebase from. Empty = repo's default branch.
  GithubToken:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Optional GitHub token for the codebase-context fetch — raises the API
      rate limit and is required if the repo is private. Empty = unauthenticated.
  LatencyAnomalySensitivity:
    Type: Number
    Default: 2
    Description: Standard deviations for the ANOMALY_DETECTION_BAND width (dashboard visualization only).
  AlarmTopicArn:
    Type: String
    Description: >
      ARN of the existing SNS topic to subscribe the Lambda to (e.g. the
      culprit-alerts topic behind culprit-App-Anomaly) — this stack does not
      create its own alarm/topic, it hooks into one that already exists.

Globals:
  Function:
    Runtime: python3.11
    Timeout: 60
    MemorySize: 256

Resources:
  # ── Lambda ──────────────────────────────────────────────────────────────
  ReviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-review"
      CodeUri: agent/
      Handler: handler.lambda_handler
      Environment:
        Variables:
          ANTHROPIC_API_KEY: !Ref AnthropicApiKey
          LOG_GROUP: !Ref LogGroupName
          GITHUB_OWNER: !Ref GithubOwner
          GITHUB_REPO: !Ref GithubRepo
          GITHUB_REF: !Ref GithubRef
          GITHUB_TOKEN: !Ref GithubToken
      Policies:
        - Statement:
            - Sid: ReadAlarmAndMetricEvidence
              Effect: Allow
              Action:
                - cloudwatch:DescribeAlarms
                - cloudwatch:GetMetricStatistics
              Resource: "*"
            - Sid: ReadLogEvidence
              Effect: Allow
              Action:
                - logs:StartQuery
                - logs:GetQueryResults
                - logs:StopQuery
              Resource: "*"
      Events:
        AlarmNotification:
          Type: SNS
          Properties:
            Topic: !Ref AlarmTopicArn

  # ── Dashboard ───────────────────────────────────────────────────────────
  # Plain metric visualization only — no Lambda-backed custom widget, so
  # this has no dependency on the review pipeline itself.
  AnomalyDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${AWS::StackName}-anomaly-dashboard"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "RequestLatency (with anomaly band)",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "HackathonDemo", "RequestLatency", { "id": "m1" } ],
                  [ { "expression": "ANOMALY_DETECTION_BAND(m1, ${LatencyAnomalySensitivity})", "label": "Expected band", "id": "ad1" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 0, "width": 12, "height": 6,
              "properties": {
                "title": "ErrorRate / CPU / RAM / Disk",
                "region": "${AWS::Region}",
                "metrics": [
                  [ "HackathonDemo", "ErrorRate" ],
                  [ "HackathonDemo", "mem_used_percent" ],
                  [ "HackathonDemo", "disk_used_percent" ]
                ]
              }
            }
          ]
        }

Outputs:
  ReviewFunctionArn:
    Value: !GetAtt ReviewFunction.Arn
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${AnomalyDashboard}"
